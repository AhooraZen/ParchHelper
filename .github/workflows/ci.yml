name: CI & Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "src/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "shell/**"
      - "config/**"
      - ".github/workflows/ci.yml"
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "src/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  code-quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-targets: "true"

      - name: Verify Formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Linter (clippy)
        run: cargo clippy --all-targets --all-features

      - name: Execute Unit & Integration Tests
        run: cargo test --all-targets

  publish-release:
    name: Build & Publish Release (${{ github.ref_name }})
    needs: code-quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch_name: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch_name: aarch64
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-all-targets: "true"

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build Release Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Distro Artifacts
        run: |
          PKG_DIR="pkg-${{ matrix.arch_name }}"
          mkdir -p "${PKG_DIR}/usr/bin" "${PKG_DIR}/etc/parch" "${PKG_DIR}/etc/profile.d" \
                   "${PKG_DIR}/usr/share/zsh/site-functions" "${PKG_DIR}/usr/share/fish/vendor_conf.d"

          cp "target/${{ matrix.target }}/release/parch-helper" "${PKG_DIR}/usr/bin/"
          cp "config/helper.toml" "${PKG_DIR}/etc/parch/"
          cp "shell/parch-helper.sh" "${PKG_DIR}/etc/profile.d/"
          cp "shell/parch-helper.zsh" "${PKG_DIR}/usr/share/zsh/site-functions/"
          cp "shell/parch-helper.fish" "${PKG_DIR}/usr/share/fish/vendor_conf.d/"

          tar -czf "parch-helper-${{ matrix.arch_name }}.tar.gz" -C "${PKG_DIR}" .
          cp "target/${{ matrix.target }}/release/parch-helper" "parch-helper-${{ matrix.arch_name }}"
          sha256sum "parch-helper-${{ matrix.arch_name }}.tar.gz" > "parch-helper-${{ matrix.arch_name }}.tar.gz.sha256"
          sha256sum "parch-helper-${{ matrix.arch_name }}" > "parch-helper-${{ matrix.arch_name }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch_name }}
          path: |
            parch-helper-${{ matrix.arch_name }}.tar.gz
            parch-helper-${{ matrix.arch_name }}.tar.gz.sha256
            parch-helper-${{ matrix.arch_name }}
            parch-helper-${{ matrix.arch_name }}.sha256

  create-github-release:
    name: Create GitHub Release
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Global SHA256 Checksums
        run: |
          cd release-assets
          sha256sum parch-helper-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish Official Tagged Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ParchHelper ${{ github.ref_name }}"
          body: |
            Official release for Parch Linux.

            ### 📦 Installation
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            release-assets/*
            CHANGELOG.md
            config/helper.toml
            shell/parch-helper.sh
            shell/parch-helper.zsh
            shell/parch-helper.fish
