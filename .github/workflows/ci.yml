name: CI & Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  code-quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-targets: "true"

      - name: Verify Formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Linter (clippy)
        run: cargo clippy --all-targets --all-features

      - name: Execute Unit & Integration Tests
        run: cargo test --all-targets

  build-matrix:
    name: Multi-Arch Build (${{ matrix.target }})
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch_name: x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            arch_name: aarch64
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-all-targets: "true"

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build Binary (Native / Cross)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Distro Artifacts
        run: |
          PKG_DIR="pkg-${{ matrix.arch_name }}"
          mkdir -p "${PKG_DIR}/usr/bin" "${PKG_DIR}/etc/parch" "${PKG_DIR}/etc/profile.d" \
                   "${PKG_DIR}/usr/share/zsh/site-functions" "${PKG_DIR}/usr/share/fish/vendor_conf.d"

          cp "target/${{ matrix.target }}/release/parch-helper" "${PKG_DIR}/usr/bin/"
          cp "config/helper.toml" "${PKG_DIR}/etc/parch/"
          cp "shell/parch-helper.sh" "${PKG_DIR}/etc/profile.d/"
          cp "shell/parch-helper.zsh" "${PKG_DIR}/usr/share/zsh/site-functions/"
          cp "shell/parch-helper.fish" "${PKG_DIR}/usr/share/fish/vendor_conf.d/"

          tar -czf "parch-helper-${{ matrix.arch_name }}.tar.gz" -C "${PKG_DIR}" .
          cp "target/${{ matrix.target }}/release/parch-helper" "parch-helper-${{ matrix.arch_name }}"
          sha256sum "parch-helper-${{ matrix.arch_name }}.tar.gz" > "parch-helper-${{ matrix.arch_name }}.tar.gz.sha256"
          sha256sum "parch-helper-${{ matrix.arch_name }}" > "parch-helper-${{ matrix.arch_name }}.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch_name }}
          path: |
            parch-helper-${{ matrix.arch_name }}.tar.gz
            parch-helper-${{ matrix.arch_name }}.tar.gz.sha256
            parch-helper-${{ matrix.arch_name }}
            parch-helper-${{ matrix.arch_name }}.sha256

  publish-release:
    name: Publish Release Assets
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Global SHA256 Checksums
        run: |
          cd release-assets
          sha256sum parch-helper-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Compute Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_DATE=$(git log -1 --date=format:'%Y-%m-%d %H:%M UTC' --pretty=%cd)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT

      - name: Publish Rolling Latest Release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "ParchHelper (${{ steps.meta.outputs.short_sha }}) • ${{ steps.meta.outputs.commit_date }}"
          body: |
            ### ⚡ Rolling Build (`${{ steps.meta.outputs.short_sha }}`)
            - **Commit:** `${{ github.sha }}`
            - **Summary:** ${{ steps.meta.outputs.commit_title }}
            - **Built on:** ${{ steps.meta.outputs.commit_date }}

            ### 📦 Quick Install
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```

            ### 🛡️ Verification
            See attached `SHA256SUMS` file for sha256 checksums.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            CHANGELOG.md
            config/helper.toml
            shell/parch-helper.sh
            shell/parch-helper.zsh
            shell/parch-helper.fish

      - name: Publish Tagged Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "ParchHelper ${{ github.ref_name }}"
          body: |
            Official release for Parch Linux.

            ### 📦 Installation
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed version history.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            CHANGELOG.md
            config/helper.toml
            shell/parch-helper.sh
            shell/parch-helper.zsh
            shell/parch-helper.fish
