[package]
name = "parch-helper"
version = "0.1.0"
edition = "2021"
authors = ["Parch Linux Developers <dev@parchlinux.com>"]
description = "Distro command translation and migration helper for Parch Linux (Arch-based)"
license = "GPL-3.0-or-later"
repository = "https://github.com/AhooraZen/ParchHelper"
readme = "README.md"
keywords = ["archlinux", "parchlinux", "pacman", "apt", "translator"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.1"
is-terminal = "0.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
